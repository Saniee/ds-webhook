[package]
name = "ds-webhook"
version = "2.0.0"
edition = "2024"
description = "A small async Discord webhook wrapper"
repository = "https://github.com/Saniee/ds-webhook"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12.12", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
