[package]
name = "ds-webhook"
version = "2.0.0"
edition = "2024"
description = "A small async Discord webhook wrapper"
repository = "https://github.com/Saniee/ds-webhook"
readme = "README.md"

[features]
## Adds `Embed::timestamp_datetime` for chrono dates.
chrono = ["dep:chrono"]
## Re-exports ds-format as `ds_webhook::format` and lets `Embed::timestamp` take a `ds_format::Timestamp`.
ds-format = ["dep:ds-format"]

[dependencies]
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
ds-format = { git = "https://github.com/Saniee/ds-format", branch = "master", optional = true }
reqwest = { version = "0.12.12", features = ["json", "multipart"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
